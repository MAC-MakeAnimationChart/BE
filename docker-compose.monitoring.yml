# MAC 모니터링 스택 (Loki + Prometheus + Grafana)
#
# 사용법:
#   docker compose -f docker-compose.monitoring.yml up -d   # 기동
#   docker compose -f docker-compose.monitoring.yml down    # 정리
#
# 앱(Spring Boot)은 로컬에서 실행 중이어야 한다.
# Prometheus 가 host.docker.internal:8080/actuator/prometheus 를 스크랩한다.
#
# Grafana: http://localhost:3000  (admin / admin)
# Loki:    http://localhost:3100
# Prometheus: http://localhost:9090

services:
  loki:
    image: grafana/loki:3.1.0
    container_name: projectmac-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: projectmac-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: projectmac-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Discord 알림 채널은 Grafana UI에서 직접 설정
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
