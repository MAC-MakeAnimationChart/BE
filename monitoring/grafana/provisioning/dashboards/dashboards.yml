apiVersion: 1

# Grafana 가 아래 경로의 대시보드 JSON 파일들을 부팅 시 자동 등록한다.
providers:
  - name: MAC Dashboards
    orgId: 1
    folder: MAC
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
