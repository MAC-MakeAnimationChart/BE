spring:
  application:
    name: projectmac
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

mac:
  logging:
    body-max-length: 2000
    slow-method:
      controller-threshold-ms: 500
      service-threshold-ms: 1000
    exclude-urls:
      - /api/v1/health
      - /actuator/**
      - /favicon.ico

  p6spy:
    slow-query-threshold-ms: 1000

  alert:
    enabled: true
    throttle-minutes: 1
    thread-pool:
      core-size: 2
      max-size: 5
      queue-capacity: 100
    discord:
      webhook-url: ${DISCORD_WEBHOOK_URL:}
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
    notify-levels:
      - ERROR
    mask-fields:
      - password
      - token
      - cardNumber
      - Authorization
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# GCS 설정. gcp.storage.bucket 이 없으면 LocalFileStorage 폴백이 동작한다.
# (bucket 은 운영(prod) 프로파일에서만 주입 → 로컬은 자동으로 로컬 저장)
gcp:
  project-id: ${GCP_PROJECT_ID:}
  storage:
    data-source-prefix: data_source
  credentials:
    location: ${GCP_CREDENTIALS_LOCATION:}
