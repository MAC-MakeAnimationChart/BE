spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

cors:
  allowed-origins: "http://localhost:3000"

jwt:
  secret: test-secret-key-minimum-32-characters-long!!
  access-expire-ms: 3600000
  refresh-expire-ms: 604800000
